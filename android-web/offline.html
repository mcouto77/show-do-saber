<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b1f" />
    <title>Show do Saber — Sem conexão</title>
  </head>
  <body style="margin: 0; background: #080b1f; color: #fff; font-family: system-ui, sans-serif">
    <main
      style="
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      "
    >
      <section style="max-width: 420px">
        <h1 style="margin: 0 0 12px; font-size: 28px">Sem conexão com a internet</h1>
        <p style="margin: 0 0 24px; color: #b9c3e5; line-height: 1.5">
          O Tutor Inteligente com IA precisa de Wi-Fi ou dados móveis para funcionar.
        </p>
        <button
          type="button"
          onclick="location.reload()"
          style="
            border: 0;
            border-radius: 14px;
            padding: 14px 22px;
            background: #16d9f5;
            color: #071126;
            font-weight: 800;
            font-size: 16px;
          "
        >
          Tentar novamente
        </button>
      </section>
    </main>
  </body>
</html>
